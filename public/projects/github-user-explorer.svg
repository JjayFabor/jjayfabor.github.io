<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">GitHub User Explorer terminal interface</title>
  <desc id="description">A schematic terminal sends a request to the GitHub API and receives a user profile response.</desc>
  <rect width="1200" height="630" fill="#0f1117"/>
  <path d="M0 1h1200v628H0z" fill="none" stroke="#252836" stroke-width="2"/>
  <g opacity=".28" stroke="#252836">
    <path d="M0 105h1200M0 210h1200M0 315h1200M0 420h1200M0 525h1200"/>
    <path d="M150 0v630M300 0v630M450 0v630M600 0v630M750 0v630M900 0v630M1050 0v630"/>
  </g>
  <rect x="82" y="96" width="690" height="438" rx="12" fill="#1c1e26" stroke="#394052" stroke-width="2"/>
  <path d="M82 151h690" stroke="#394052" stroke-width="2"/>
  <circle cx="118" cy="124" r="7" fill="#06b6d4"/>
  <circle cx="144" cy="124" r="7" fill="#64748b"/>
  <circle cx="170" cy="124" r="7" fill="#64748b"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="116" y="213" fill="#06b6d4" font-size="25">$ python explorer.py</text>
    <text x="116" y="265" fill="#94a3b8" font-size="22">GitHub username:</text>
    <text x="344" y="265" fill="#e2e8f0" font-size="22">JjayFabor</text>
    <text x="116" y="337" fill="#64748b" font-size="19">GET /users/JjayFabor</text>
    <text x="116" y="391" fill="#22d3ee" font-size="20">200 OK</text>
    <text x="116" y="441" fill="#e2e8f0" font-size="19">history.json updated</text>
    <rect x="116" y="471" width="13" height="24" fill="#06b6d4"/>
  </g>
  <path d="M813 315h84" fill="none" stroke="#06b6d4" stroke-width="4"/>
  <path d="m881 300 16 15-16 15" fill="none" stroke="#06b6d4" stroke-linecap="square" stroke-width="4"/>
  <rect x="935" y="216" width="183" height="198" rx="12" fill="#1c1e26" stroke="#06b6d4" stroke-width="2"/>
  <circle cx="1027" cy="276" r="30" fill="none" stroke="#06b6d4" stroke-width="3"/>
  <path d="M977 357c13-31 35-47 50-47s37 16 50 47" fill="none" stroke="#06b6d4" stroke-width="3"/>
  <text x="1027" y="458" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" text-anchor="middle">GITHUB API</text>
</svg>
