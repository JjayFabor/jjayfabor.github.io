<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%">
    <rect width="400" height="160" fill="#f1f5f9"/>

    <!-- CRM hub (sprocket-style network) -->
    <line x1="90" y1="80" x2="55" y2="45" stroke="#ff7a59" stroke-width="4"/>
    <line x1="90" y1="80" x2="125" y2="45" stroke="#ff7a59" stroke-width="4"/>
    <line x1="90" y1="80" x2="90" y2="125" stroke="#ff7a59" stroke-width="4"/>
    <circle cx="55" cy="45" r="7" fill="#ff7a59"/>
    <circle cx="125" cy="45" r="7" fill="#ff7a59"/>
    <circle cx="90" cy="125" r="7" fill="#ff7a59"/>
    <circle cx="90" cy="80" r="22" fill="#ff7a59"/>
    <circle cx="90" cy="80" r="9" fill="#f1f5f9"/>

    <!-- Sync arrows -->
    <path d="M175 68 a34 34 0 0 1 50 4" stroke="#2563eb" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M225 72 l8 -12 M225 72 l-14 3" stroke="#2563eb" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M225 92 a34 34 0 0 1 -50 -4" stroke="#64748b" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M175 88 l-8 12 M175 88 l14 -3" stroke="#64748b" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- Pipeline database -->
    <path d="M280 56 v48 a35 11 0 0 0 70 0 v-48 z" fill="#3b82f6"/>
    <ellipse cx="315" cy="56" rx="35" ry="11" fill="#60a5fa"/>
    <path d="M280 72 a35 11 0 0 0 70 0" stroke="#dbeafe" stroke-width="3" fill="none"/>
    <path d="M280 88 a35 11 0 0 0 70 0" stroke="#dbeafe" stroke-width="3" fill="none"/>
</svg>
