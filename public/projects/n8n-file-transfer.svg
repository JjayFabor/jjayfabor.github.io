<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%">
    <rect width="400" height="160" fill="#f1f5f9"/>

    <!-- Connectors between workflow nodes -->
    <line x1="120" y1="80" x2="160" y2="80" stroke="#94a3b8" stroke-width="3"/>
    <line x1="240" y1="80" x2="280" y2="80" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="120" cy="80" r="4" fill="#64748b"/>
    <circle cx="160" cy="80" r="4" fill="#64748b"/>
    <circle cx="240" cy="80" r="4" fill="#64748b"/>
    <circle cx="280" cy="80" r="4" fill="#64748b"/>

    <!-- Node 1: Drive folder -->
    <rect x="40" y="50" width="80" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M61 71 h15 l5 5 h18 a3 3 0 0 1 3 3 v13 a3 3 0 0 1 -3 3 h-38 a3 3 0 0 1 -3 -3 v-18 a3 3 0 0 1 3 -3 z" fill="#f59e0b"/>

    <!-- Node 2: access control (lock) -->
    <rect x="160" y="50" width="80" height="60" rx="10" fill="#2563eb"/>
    <path d="M192 76 v-5 a8 8 0 0 1 16 0 v5" stroke="#ffffff" stroke-width="4" fill="none"/>
    <rect x="186" y="76" width="28" height="20" rx="4" fill="#ffffff"/>
    <circle cx="200" cy="85" r="3.5" fill="#2563eb"/>

    <!-- Node 3: employees by role -->
    <rect x="280" y="50" width="80" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="308" cy="72" r="7" fill="#475569"/>
    <path d="M296 98 a12 11 0 0 1 24 0 z" fill="#475569"/>
    <circle cx="332" cy="72" r="7" fill="#94a3b8"/>
    <path d="M320 98 a12 11 0 0 1 24 0 z" fill="#94a3b8"/>
</svg>
