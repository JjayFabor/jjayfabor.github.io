<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Page not found — Jjay Fabor</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#0F1117" />

    <!--
      Served by Cloudflare with a real 404 status for any unknown path
      (see `not_found_handling` in wrangler.jsonc). It is deliberately a plain
      static page rather than the React app: an error page that has to boot a
      580 kB bundle before it can say "not found" is the wrong trade, and the
      SPA fallback is what made dead URLs answer 200 in the first place.

      Brand tokens are copied from src/index.css rather than imported, since
      this file ships as-is from public/ and never goes through the bundler.
    -->
    <style>
      :root {
        --bg: #f8fafc;
        --surface: #ffffff;
        --border: #e2e8f0;
        --accent: #0e7490;
        --accent-hover: #0891b2;
        --text: #0f1117;
        --muted: #64748b;
      }
      :root.dark {
        --bg: #0f1117;
        --surface: #1c1e26;
        --border: #252836;
        --accent: #06b6d4;
        --accent-hover: #22d3ee;
        --text: #e2e8f0;
        --muted: #64748b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 30rem;
      }
      .mark {
        width: 40px;
        height: 40px;
        display: block;
        object-fit: contain;
        user-select: none;
      }
      .code {
        margin: 28px 0 0;
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo,
          monospace;
        font-size: 0.8125rem;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      h1 {
        margin: 8px 0 0;
        font-size: 1.75rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 12px 0 0;
        color: var(--muted);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        padding: 10px 18px;
        border-radius: 9999px;
        font-size: 0.9375rem;
        font-weight: 500;
        text-decoration: none;
        border: 1px solid var(--accent);
        transition: background-color 0.15s, color 0.15s, border-color 0.15s;
      }
      a.primary {
        background: var(--accent);
        color: var(--bg);
      }
      a.primary:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }
      a.secondary {
        color: var(--accent);
      }
      a.secondary:hover {
        color: var(--accent-hover);
        border-color: var(--accent-hover);
      }
      a.button:focus-visible {
        outline: 2px solid var(--accent-hover);
        outline-offset: 2px;
      }
    </style>
    <script>
      // Match whichever theme the visitor last chose on the site. This mirrors
      // src/context/ThemeContext.jsx, which writes "dark" | "light" to
      // localStorage.theme and toggles `.dark` on <html>; with nothing saved,
      // both fall back to the OS preference. Inline and synchronous, so the
      // page never flashes the wrong theme.
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark =
            saved === "dark" ||
            (!saved &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <main>
      <a href="/" aria-label="Jjay Fabor — home" style="text-decoration: none">
        <img class="mark" src="/logo-jf.png" alt="JF gear logo" />
      </a>
      <p class="code">404</p>
      <h1>This page isn't here.</h1>
      <p>
        The link may be out of date, or the project it pointed to may have been
        retired. Everything I'm currently showing is on the projects page.
      </p>
      <div class="actions">
        <a class="button primary" href="/projects">Browse projects</a>
        <a class="button secondary" href="/">Go home</a>
      </div>
    </main>
  </body>
</html>
